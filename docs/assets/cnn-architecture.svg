<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1120" height="340" rx="10" fill="#0f172a"/>
  
  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="18" font-weight="700">MAX78000 7-Layer CNN Architecture (ai85-burgerpizza-qat8-q)</text>
  <text x="32" y="60" fill="#94a3b8" font-size="12">Total: 51,368,960 Ops (50,432,000 MACC | 936,960 Comp)  •  Weight Memory: 57,776 B / 442,368 B (13.1%)  •  Bias: 2 B</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Input Node -->
  <g transform="translate(24, 92)">
    <rect width="102" height="175" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="51" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">INPUT FIFO</text>
    <text x="51" y="48" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">3 × 128 × 128</text>
    <text x="51" y="70" fill="#cbd5e1" font-size="11" text-anchor="middle">HWC RGB888</text>
    <text x="51" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">0x00bbggrr</text>
    <text x="51" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">Range [-128, 127]</text>
    <rect x="10" y="132" width="82" height="28" rx="4" fill="#0f172a"/>
    <text x="51" y="150" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">0x50000008</text>
  </g>

  <line x1="126" y1="180" x2="144" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 0 -->
  <g transform="translate(148, 92)">
    <rect width="110" height="175" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="55" y="24" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">LAYER 0</text>
    <text x="55" y="46" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">16 × 128 × 128</text>
    <text x="55" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">Conv2D 3×3</text>
    <text x="55" y="86" fill="#94a3b8" font-size="10" text-anchor="middle">Stride 1, Pad 1</text>
    <text x="55" y="104" fill="#94a3b8" font-size="10" text-anchor="middle">No Pool • ReLU</text>
    <text x="55" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">Streaming</text>
    <rect x="10" y="134" width="90" height="28" rx="4" fill="#0f172a"/>
    <text x="55" y="152" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">7.34M Ops</text>
  </g>

  <line x1="258" y1="180" x2="276" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1 -->
  <g transform="translate(280, 92)">
    <rect width="110" height="175" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="24" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">LAYER 1</text>
    <text x="55" y="46" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">32 × 64 × 64</text>
    <text x="55" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">MaxPool 2×2</text>
    <text x="55" y="86" fill="#cbd5e1" font-size="11" text-anchor="middle">Conv2D 3×3</text>
    <text x="55" y="104" fill="#94a3b8" font-size="10" text-anchor="middle">Stride 1, Pad 1</text>
    <text x="55" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">ReLU • Stream</text>
    <rect x="10" y="134" width="90" height="28" rx="4" fill="#0f172a"/>
    <text x="55" y="152" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">19.27M Ops</text>
  </g>

  <line x1="390" y1="180" x2="408" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <g transform="translate(412, 92)">
    <rect width="110" height="175" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="55" y="24" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">LAYER 2</text>
    <text x="55" y="46" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">64 × 32 × 32</text>
    <text x="55" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">MaxPool 2×2</text>
    <text x="55" y="86" fill="#cbd5e1" font-size="11" text-anchor="middle">Conv2D 3×3</text>
    <text x="55" y="104" fill="#94a3b8" font-size="10" text-anchor="middle">Stride 1, Pad 1</text>
    <text x="55" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">ReLU</text>
    <rect x="10" y="134" width="90" height="28" rx="4" fill="#0f172a"/>
    <text x="55" y="152" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">19.07M Ops</text>
  </g>

  <line x1="522" y1="180" x2="540" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <g transform="translate(544, 92)">
    <rect width="106" height="175" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="53" y="24" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">LAYER 3</text>
    <text x="53" y="46" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">32 × 16 × 16</text>
    <text x="53" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">MaxPool 2×2</text>
    <text x="53" y="86" fill="#cbd5e1" font-size="11" text-anchor="middle">Conv2D 3×3</text>
    <text x="53" y="104" fill="#94a3b8" font-size="10" text-anchor="middle">Stride 1, Pad 1</text>
    <text x="53" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">ReLU</text>
    <rect x="10" y="134" width="86" height="28" rx="4" fill="#0f172a"/>
    <text x="53" y="152" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">4.79M Ops</text>
  </g>

  <line x1="650" y1="180" x2="668" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4 -->
  <g transform="translate(672, 92)">
    <rect width="102" height="175" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="51" y="24" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">LAYER 4</text>
    <text x="51" y="46" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">32 × 8 × 8</text>
    <text x="51" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">MaxPool 2×2</text>
    <text x="51" y="86" fill="#cbd5e1" font-size="11" text-anchor="middle">Conv2D 3×3</text>
    <text x="51" y="104" fill="#94a3b8" font-size="10" text-anchor="middle">Stride 1, Pad 1</text>
    <text x="51" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">ReLU</text>
    <rect x="10" y="134" width="82" height="28" rx="4" fill="#0f172a"/>
    <text x="51" y="152" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">600K Ops</text>
  </g>

  <line x1="774" y1="180" x2="792" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5 -->
  <g transform="translate(796, 92)">
    <rect width="102" height="175" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="51" y="24" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">LAYER 5</text>
    <text x="51" y="46" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">16 × 8 × 8</text>
    <text x="51" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">No Pooling</text>
    <text x="51" y="86" fill="#cbd5e1" font-size="11" text-anchor="middle">Conv2D 3×3</text>
    <text x="51" y="104" fill="#94a3b8" font-size="10" text-anchor="middle">Stride 1, Pad 1</text>
    <text x="51" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">ReLU</text>
    <rect x="10" y="134" width="82" height="28" rx="4" fill="#0f172a"/>
    <text x="51" y="152" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">296K Ops</text>
  </g>

  <line x1="898" y1="180" x2="916" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 6 + Softmax -->
  <g transform="translate(920, 92)">
    <rect width="176" height="175" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="88" y="24" fill="#22c55e" font-size="12" font-weight="700" text-anchor="middle">LAYER 6 + SOFTMAX</text>
    <text x="88" y="46" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">1024 → 2 Logits</text>
    <text x="88" y="66" fill="#cbd5e1" font-size="11" text-anchor="middle">Linear (2,048 MACC)</text>
    <text x="88" y="84" fill="#94a3b8" font-size="10" text-anchor="middle">Q17.14 → Q15 Softmax</text>
    <rect x="12" y="98" width="152" height="64" rx="4" fill="#0f172a"/>
    <text x="88" y="118" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle">Class 0: Burger (100.0%)</text>
    <text x="88" y="136" fill="#94a3b8" font-size="11" text-anchor="middle">Class 1: Pizza (0.0%)</text>
    <text x="88" y="152" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">Addr: 0x50401000</text>
  </g>

  <!-- Footer Legend -->
  <text x="32" y="308" fill="#64748b" font-size="11">Note: Layers 1 and 2 account for 74.6% of total compute (38.34M / 51.37M operations). Input streamed via hardware FIFO 0.</text>
</svg>
